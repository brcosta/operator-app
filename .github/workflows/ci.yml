name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-test:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate project metadata
        run: |
          plutil -lint Operator.xcodeproj/project.pbxproj
          plutil -lint Packaging/Info.plist
          version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Version.xcconfig | tr -d '[:space:]')
          build=$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' Config/Version.xcconfig | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
      - name: Resolve and build
        run: swift build -c release
      - name: Lint Swift formatting
        run: |
          swift format lint Package.swift
          swift format lint -r Sources Tests UITests
      - name: Run Swift tests
        run: swift test
      - name: Package app bundle
        run: zsh Scripts/package-app.sh "$RUNNER_TEMP/Operator.app"
      - name: Verify packaged version
        run: |
          expected_version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Version.xcconfig | tr -d '[:space:]')
          expected_build=$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' Config/Version.xcconfig | tr -d '[:space:]')
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Operator.app/Contents/Info.plist")" == "$expected_version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Operator.app/Contents/Info.plist")" == "$expected_build" ]]
      - name: Smoke test packaged app
        run: zsh Scripts/smoke-test-app.sh "$RUNNER_TEMP/Operator.app"
