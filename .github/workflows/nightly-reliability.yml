name: Nightly Reliability

on:
  schedule:
    - cron: '17 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat-stateful-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Repeat stateful test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          for attempt in 1 2 3; do
            swift test 2>&1 | tee "test-logs/attempt-${attempt}.log"
          done
      - name: Upload reliability logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-nightly-test-logs
          path: test-logs
          if-no-files-found: warn
          retention-days: 14
