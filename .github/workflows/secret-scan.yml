name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository history
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          download_dir="$RUNNER_TEMP/gitleaks-download"
          mkdir -p "$download_dir"
          cd "$download_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "$release_url/$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan full Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --redact
          --no-banner
          --verbose
          "$GITHUB_WORKSPACE"
